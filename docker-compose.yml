services:
  mysql:
    image: mysql:8.0
    container_name: retail_dw_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-warehouse_root_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-retail_dw}
      MYSQL_USER: ${MYSQL_USER:-dw_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dw_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
